[package]
name = "irah-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Browser WebAssembly bindings for Iroh"
repository = "https://github.com/andrewvelez/irah_wasm"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1.7"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
